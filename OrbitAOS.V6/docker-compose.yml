version: '3.8'

services:
  orbitaos-v6:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbitaos-v6:latest
    container_name: orbitaos-v6-app
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=host.docker.internal,1433;Database=OrbitAOS;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True}
      - ExternalUrls__AspNetCoreDocsUrl=https://docs.microsoft.com/aspnet/core
    volumes:
      - ./logs:/app/logs
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
    networks:
      - orbitaos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  orbitaos-network:
    driver: bridge
