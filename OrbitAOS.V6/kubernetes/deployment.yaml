apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitaos-v6
  namespace: orbitaos-v6
  labels:
    app: orbitaos-v6
    version: "1.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orbitaos-v6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orbitaos-v6
        version: "1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: orbitaos-v6
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
              value: "false"
            - name: TZ
              value: "UTC"
            - name: ConnectionStrings__DefaultConnection
              value: "{{CONNECTION_STRING}}"
            - name: ApiUrls__AspNetCoreDocsUrl
              value: "{{ASPNETCORE_DOCS_URL}}"
            - name: STATIC_FILES_CACHE_MAX_AGE
              value: "{{STATIC_FILES_CACHE_MAX_AGE}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs
      volumes:
        - name: logs-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
